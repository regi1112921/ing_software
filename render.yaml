# Blueprint de Render: los cuatro servicios del backend (una misma imagen, backend/Dockerfile).
# Render → New → Blueprint → elegir este repositorio. DATABASE_URL se pide al crear
# (cadena del Session pooler de Supabase); nunca la escribas en este archivo.
# Frontends: frontend/ (panel) y catalogo/ (catálogo público) van en Vercel.

envVarGroups:
  - name: huellas-backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "3"
      - key: TZ
        value: America/La_Paz
      - key: TRUST_PROXY
        value: "1"
      - key: SESION_HORAS
        value: "8"
      - key: AUTENTICACION_URL
        value: https://huellas-autenticacion.onrender.com
      - key: CORS_ORIGENES
        value: https://huellas-panel.vercel.app,https://huellas-catalogo.vercel.app

services:
  - type: web
    name: huellas-autenticacion
    runtime: docker
    region: ohio
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: node services/autenticacion/src/index.js
    healthCheckPath: /health
    envVars:
      - fromGroup: huellas-backend
      - key: AUTENTICACION_PORT
        value: "10000"

  - type: web
    name: huellas-veterinaria
    runtime: docker
    region: ohio
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: node services/veterinaria/src/index.js
    healthCheckPath: /health
    envVars:
      - fromGroup: huellas-backend
      - key: VETERINARIA_PORT
        value: "10000"

  - type: web
    name: huellas-adopcion
    runtime: docker
    region: ohio
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: node services/adopcion/src/index.js
    healthCheckPath: /health
    envVars:
      - fromGroup: huellas-backend
      - key: ADOPCION_PORT
        value: "10000"
      - key: SOLICITUDES_PUBLICAS_MAXIMO
        value: "5"
      - key: SOLICITUDES_PUBLICAS_VENTANA_MINUTOS
        value: "60"

  - type: web
    name: huellas-dashboard
    runtime: docker
    region: ohio
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: node services/dashboard/src/index.js
    healthCheckPath: /health
    envVars:
      - fromGroup: huellas-backend
      - key: DASHBOARD_PORT
        value: "10000"
