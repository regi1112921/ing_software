# Sirve el frontend y redirige /api/<servicio>/ al contenedor de cada servicio
# (lo mismo que hace el proxy de Vite en desarrollo). La barra final de
# proxy_pass quita el prefijo: /api/adopcion/perros → http://adopcion:3002/perros
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 1m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location /api/autenticacion/ { proxy_pass http://autenticacion:3004/; }
  location /api/veterinaria/   { proxy_pass http://veterinaria:3001/; }
  location /api/adopcion/      { proxy_pass http://adopcion:3002/; }
  location /api/dashboard/     { proxy_pass http://dashboard:3003/; }

  # Archivos con hash en el nombre: se pueden guardar en caché para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rutas de React Router (/perros/5, /adopciones…): siempre index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
