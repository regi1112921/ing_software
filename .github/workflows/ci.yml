# Integración continua de HUELLAS.
# Corre en cada push y en cada pull request hacia main o develop:
#   1. backend    → pruebas de aceptación de las HU (PostgreSQL en memoria con PGlite)
#   2. frontend   → chequeo de tipos y build de producción
#   3. api-docs   → valida la especificación OpenAPI (docs/api/openapi.yaml)
#   4. api-e2e    → levanta BD + 4 servicios con Docker Compose y corre la colección de Postman con Newman
name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend · tipos y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # build = tsc --noEmit && vite build
      - run: npm run build

  api-docs:
    name: API · OpenAPI válido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@2.60.0 lint docs/api/openapi.yaml --config docs/api/redocly.yaml

  api-e2e:
    name: API · colección de Postman (Newman)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Levantar base de datos y servicios
        run: docker compose up -d --build --wait db autenticacion veterinaria adopcion dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correr la colección
        run: >
          npx --yes newman@6.2.1 run docs/api/huellas.postman_collection.json
          -e docs/api/local.postman_environment.json
          --reporters cli,junit --reporter-junit-export newman-resultados.xml
      - name: Guardar resultados de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-resultados
          path: newman-resultados.xml
      - name: Logs de los servicios (si falla)
        if: failure()
        run: docker compose logs --no-color
      - name: Apagar
        if: always()
        run: docker compose down -v
