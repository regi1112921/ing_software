openapi: 3.1.0
info:
  title: HUELLAS · API del albergue
  version: 1.0.0
  description: |
    API REST de los cinco microservicios de HUELLAS. Cada servicio corre en su propio puerto,
    por eso cada ruta declara su `servers` (con Docker Compose o `npm run dev` en `backend/`).

    **Sesión:** todas las rutas, salvo `POST /auth/login`, `POST /auth/registro`, `GET /health` y las del
    catálogo público (`/publico/*`, HU-09), exigen `Authorization: Bearer <token>`. El token se obtiene con `POST /auth/login`.

    **Convenciones:** JSON con campos en `snake_case` (iguales a las columnas de la BD) y fechas `AAAA-MM-DD`.
    Los errores responden `{ "error": "mensaje" }` y, si son de validación, también `detalles` por campo.

    Usuarios de prueba (Docker, contraseña `huellas123`): `maria.alvarado@peluchin.test` (responsable_adopciones),
    `andres.ramirez@peluchin.test` (veterinario) y `admin@peluchin.test` (administrador, el único que ve el Dashboard).
  contact:
    name: Equipo HUELLAS · SIS-213 Ingeniería del Software (UCB)

servers:
  - url: http://localhost:3004
    description: Autenticación
  - url: http://localhost:3002
    description: Adopción
  - url: http://localhost:3001
    description: Veterinaria
  - url: http://localhost:3003
    description: Dashboard
  - url: http://localhost:3005
    description: Voluntariado

tags:
  - name: Autenticación
    description: "Puerto 3004 · HU-02, HU-03"
  - name: Perros
    description: "Servicio de Adopción, puerto 3002 · HU-04 a HU-07"
  - name: Adopciones
    description: "Servicio de Adopción, puerto 3002 · HU-10 a HU-12"
  - name: Catálogo público
    description: "Servicio de Adopción, puerto 3002 · HU-09 y HU-14 (historias). Sin sesión: lo usa el sitio público (Vercel)."
  - name: Solicitudes web
    description: "Servicio de Adopción, puerto 3002 · HU-09. Bandeja privada de las solicitudes del catálogo (administrador y responsable_adopciones)."
  - name: Seguimientos
    description: "Servicio de Adopción, puerto 3002 · HU-10 (seguimiento después de la adopción). Administrador y responsable_adopciones."
  - name: Avisos
    description: "Servicio de Adopción, puerto 3002 · HU-13 (aviso al adoptante por WhatsApp al aprobar o rechazar su solicitud). Administrador y responsable_adopciones."
  - name: Historias
    description: "Servicio de Adopción, puerto 3002 · HU-14 (historias de adopciones exitosas). Solo rol administrador; la sección pública está en Catálogo público."
  - name: Fotos
    description: "Servicio de Adopción, puerto 3002. Subida de fotos de perros e historias a Supabase Storage. Cualquier rol con sesión."
  - name: Veterinaria
    description: "Puerto 3001 · HU-08, HU-09, HU-11 (agenda de citas)"
  - name: Dashboard
    description: "Puerto 3003 · HU-12 (filtro de fechas), HU-13 a HU-15. Solo rol administrador."
  - name: Voluntariado
    description: "Puerto 3005 · HU-16. Solo rol administrador."
  - name: Salud
    description: Todos los servicios exponen `GET /health`.

security:
  - bearer: []

paths:
  # ───────────────────────── Autenticación ─────────────────────────
  /auth/login:
    servers: &srvAuth
      - url: http://localhost:3004
        description: Autenticación
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: "HU-02 · RF-01 y HU-07. Credenciales incorrectas, usuario inactivo o sin contraseña → 401 con el mismo mensaje. En el 2.º intento fallido seguido el mensaje avisa que queda 1 intento; al 3.º la cuenta se bloquea 5 minutos (429). Un login correcto reinicia el contador."
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, contrasena]
              properties:
                correo: { type: string, example: maria.alvarado@peluchin.test }
                contrasena: { type: string, example: huellas123 }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaLogin' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401':
          description: Usuario o contraseña incorrectos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Usuario o contraseña incorrectos. }
        '429':
          description: Cuenta bloqueada por intentos fallidos (HU-07). Mientras dura el bloqueo responde 429 aunque la contraseña sea correcta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Demasiados intentos fallidos. La cuenta está bloqueada; vuelve a intentarlo en 5 minutos.' }

  /auth/registro:
    servers: *srvAuth
    post:
      tags: [Autenticación]
      summary: Crear cuenta (rol responsable_adopciones)
      description: Crea una cuenta siempre con rol `responsable_adopciones` y deja la sesión iniciada (misma respuesta que el login).
      operationId: registrarse
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_completo, correo, contrasena]
              properties:
                nombre_completo: { type: string, maxLength: 150, example: Sofía Quispe }
                correo: { type: string, format: email, example: sofia.quispe@peluchin.test }
                contrasena: { type: string, minLength: 8, maxLength: 72, example: Clave-Segura-1 }
      responses:
        '201':
          description: Cuenta creada y sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaLogin' }
        '400': { $ref: '#/components/responses/Validacion' }
        '409':
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    servers: *srvAuth
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: HU-03 · RF-02. Invalida el token enviado.
      operationId: cerrarSesion
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /auth/sesion:
    servers: *srvAuth
    get:
      tags: [Autenticación]
      summary: Usuario de la sesión
      description: La usan el frontend (nombre y rol para el menú) y los demás servicios para validar el token.
      operationId: obtenerSesion
      responses:
        '200':
          description: Sesión válida
          content:
            application/json:
              schema:
                type: object
                required: [usuario]
                properties:
                  usuario: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  # ───────────────────────── Adopción · perros ─────────────────────────
  /catalogos:
    servers: &srvAdopcion
      - url: http://localhost:3002
        description: Adopción
    get:
      tags: [Perros]
      summary: Catálogos para los formularios
      description: HU-04. Razas activas, tamaños y estados del perro y de la adopción.
      operationId: listarCatalogos
      responses:
        '200':
          description: Catálogos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalogos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /perros:
    servers: *srvAdopcion
    get:
      tags: [Perros]
      summary: Listar, buscar y filtrar perros
      description: HU-06 · RF-07, RF-08, RF-09.
      operationId: listarPerros
      parameters:
        - name: buscar
          in: query
          description: Busca por nombre o raza (sin distinguir mayúsculas).
          schema: { type: string, maxLength: 100 }
        - name: estado
          in: query
          description: Código del estado.
          schema: { $ref: '#/components/schemas/EstadoPerro' }
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                required: [total, perros]
                properties:
                  total: { type: integer, example: 8 }
                  perros:
                    type: array
                    items: { $ref: '#/components/schemas/Perro' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Perros]
      summary: Registrar perro
      description: |
        HU-04 · RF-05. Se indica `fecha_nacimiento` **o** `edad_aproximada` (no ambas).
        El estado solo puede ser `disponible` (por defecto) o `en_tratamiento`; los de adopción los asigna el proceso de adopción.
      operationId: registrarPerro
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatosPerro' }
            example:
              nombre: Firulais
              raza_id: 1
              sexo: macho
              tamano: mediano
              fecha_ingreso: '2026-10-01'
              edad_aproximada: { anios: 2, meses: 0 }
              color: Marrón
      responses:
        '201':
          description: Perro registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerroDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /perros/{id}:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Perros]
      summary: Ficha de un perro
      description: HU-07 · RF-10. Incluye la adopción vigente (en proceso o aprobada), si la hay.
      operationId: obtenerPerro
      responses:
        '200':
          description: Ficha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerroDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Perros]
      summary: Editar perro
      description: |
        HU-05 · RF-06. Mismos campos que el registro. `estado` es opcional y solo puede ser
        `disponible` o `en_tratamiento`; si el perro tiene una adopción en curso o ya fue adoptado responde 409.
      operationId: editarPerro
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatosPerro' }
      responses:
        '200':
          description: Perro actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerroDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ───────────────────────── Adopción · adopciones ─────────────────────────
  /adopciones:
    servers: *srvAdopcion
    get:
      tags: [Adopciones]
      summary: Listar adopciones
      description: HU-11 · RF-15. De la solicitud más reciente a la más antigua.
      operationId: listarAdopciones
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                required: [total, adopciones]
                properties:
                  total: { type: integer, example: 3 }
                  adopciones:
                    type: array
                    items: { $ref: '#/components/schemas/Adopcion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Adopciones]
      summary: Registrar adopción
      description: |
        HU-10 · RF-13, RF-14, RF-19. Solo para perros `disponible`. Siempre se crea `en_proceso`
        y el perro pasa a `en_adopcion`. Si el `documento_identidad` ya existe, se reutiliza ese adoptante.
      operationId: registrarAdopcion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perro_id, adoptante]
              properties:
                perro_id: { type: integer, example: 6 }
                adoptante:
                  type: object
                  required: [nombre_completo, telefono, direccion]
                  properties:
                    nombre_completo: { type: string, maxLength: 150, example: Laura Ríos }
                    documento_identidad: { type: [string, 'null'], maxLength: 30, example: '9123456' }
                    telefono:
                      type: string
                      description: 7 a 15 dígitos; puede empezar con `+`. Se ignoran espacios y guiones.
                      example: '71112233'
                    direccion: { type: string, maxLength: 250, example: 'Calle 1, La Paz' }
                fecha_solicitud: { type: string, format: date, description: Hoy si no se indica. }
                observaciones: { type: [string, 'null'], maxLength: 2000 }
                solicitud_publica_id:
                  type: [integer, 'null']
                  description: "HU-09: solicitud del catálogo público de la que nace la adopción. Debe estar pendiente y ser del mismo perro; queda `convertida` en la misma transacción."
      responses:
        '201':
          description: Adopción registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdopcionDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /adopciones/{id}:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Adopciones]
      summary: Detalle de una adopción
      description: HU-11 · RF-16. Incluye `transiciones_permitidas` desde el estado actual.
      operationId: obtenerAdopcion
      responses:
        '200':
          description: Detalle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdopcionDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /adopciones/{id}/estado:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Adopciones]
      summary: Cambiar el estado de una adopción
      description: |
        HU-12 · RF-17, RF-18, RF-19, RF-20. Transiciones: `en_proceso → aprobada | rechazada`,
        `aprobada → finalizada | rechazada`. Al finalizar, el perro pasa a `adoptado`; al rechazar, vuelve a `disponible`.

        HU-13: al rechazar, `motivo_rechazo` es obligatorio (se le comunica al adoptante; en otros estados se ignora).
        Al aprobar o rechazar, la respuesta trae `aviso` con el mensaje para el adoptante y el enlace de WhatsApp
        (no se registra hasta `POST /adopciones/{id}/avisos`). Al finalizar, `aviso` es `null`.
      operationId: cambiarEstadoAdopcion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [aprobada, rechazada, finalizada] }
                fecha: { type: string, format: date, description: Hoy si no se indica. }
                observaciones: { type: [string, 'null'], maxLength: 2000, description: Notas internas; no van en el aviso. }
                motivo_rechazo:
                  type: [string, 'null']
                  maxLength: 500
                  description: HU-13. Obligatorio si `estado` es `rechazada`; va en el aviso al adoptante.
            examples:
              aprobar: { value: { estado: aprobada } }
              rechazar: { value: { estado: rechazada, motivo_rechazo: La vivienda no tiene espacio adecuado para un perro grande. } }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AdopcionDetalle'
                  - type: object
                    properties:
                      aviso:
                        description: HU-13. Mensaje listo para el adoptante (null al finalizar).
                        oneOf:
                          - $ref: '#/components/schemas/AvisoBorrador'
                          - type: 'null'
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ───────────────────────── Adopción · avisos al adoptante (HU-13) ─────────────────────────
  /adopciones/{id}/avisos:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Avisos]
      summary: Avisos enviados al adoptante
      description: HU-13. Registro de avisos de la adopción (quién, cuándo y el texto), del más reciente al más antiguo.
      operationId: listarAvisos
      responses:
        '200':
          description: Avisos
          content:
            application/json:
              schema:
                type: object
                required: [total, avisos]
                properties:
                  total: { type: integer, example: 1 }
                  avisos:
                    type: array
                    items: { $ref: '#/components/schemas/Aviso' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Avisos]
      summary: Registrar el envío de un aviso
      description: |
        HU-13. Registra quién envía el aviso, cuándo, a qué teléfono y el texto, y devuelve `enlace_whatsapp`
        (`https://wa.me/<telefono>?text=...`) para abrirlo con el mensaje ya escrito. El tipo sale del estado:
        `aprobacion` si está aprobada, `rechazo` si está rechazada; en proceso o finalizada → 409.
        Sin `mensaje` se envía el sugerido; con `mensaje`, el texto ajustado por el responsable.
      operationId: registrarAviso
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mensaje: { type: [string, 'null'], maxLength: 2000 }
            example: {}
      responses:
        '201':
          description: Aviso registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Aviso' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /adopciones/{id}/avisos/borrador:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Avisos]
      summary: Mensaje sugerido para el adoptante
      description: |
        HU-13. Mensaje según el estado actual, sin registrarlo: el de aprobación con los siguientes pasos y el de
        rechazo con el motivo. El teléfono va en formato internacional sin `+` (se antepone 591 si no tiene código
        de país). En proceso o finalizada → 409.
      operationId: borradorAviso
      responses:
        '200':
          description: Mensaje sugerido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvisoBorrador' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ───────────────────────── Adopción · fotos ─────────────────────────
  /fotos:
    servers: *srvAdopcion
    post:
      tags: [Fotos]
      summary: Subir una foto
      description: |
        Sube la imagen a Supabase Storage (bucket público `fotos`) y devuelve su URL pública, que se guarda después
        como `foto_url` del perro o de la historia. El cuerpo es la imagen tal cual. El tipo se comprueba por el
        contenido: solo JPG, PNG o WebP (otro → 400). Más de 5 MB → 413. Sin Storage configurado → 503;
        si Supabase falla → 502.
      operationId: subirFoto
      parameters:
        - { name: carpeta, in: query, required: true, schema: { type: string, enum: [perros, historias] } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '201':
          description: Foto subida
          content:
            application/json:
              schema:
                type: object
                required: [url, ruta, tipo, tamano]
                properties:
                  url: { type: string, format: uri, example: 'https://hvwhkdhnlrubmzxzincz.supabase.co/storage/v1/object/public/fotos/perros/0b9c2f1e-1d7a-4f1e-9a51-3c1c7f0d2b11.jpg' }
                  ruta: { type: string, example: perros/0b9c2f1e-1d7a-4f1e-9a51-3c1c7f0d2b11.jpg }
                  tipo: { type: string, enum: [image/jpeg, image/png, image/webp] }
                  tamano: { type: integer, description: Bytes., example: 284512 }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '413':
          description: La foto supera 5 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: La foto no puede superar 5 MB. }
        '502':
          description: Supabase Storage no respondió o rechazó la subida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Falta SUPABASE_URL o SUPABASE_SERVICE_ROLE_KEY en el servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── Adopción · historias (HU-14) ─────────────────────────
  /historias:
    servers: *srvAdopcion
    get:
      tags: [Historias]
      summary: Historias publicadas
      description: HU-14. Visibles y ocultas, de la más reciente a la más antigua. `visible` filtra por estado.
      operationId: listarHistorias
      parameters:
        - { name: visible, in: query, required: false, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Historias
          content:
            application/json:
              schema:
                type: object
                required: [total, historias]
                properties:
                  total: { type: integer, example: 1 }
                  historias: { type: array, items: { $ref: '#/components/schemas/Historia' } }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Historias]
      summary: Publicar una historia
      description: |
        HU-14. Foto y relato ligados a una adopción finalizada (una historia por adopción). La fecha de publicación
        va entre la entrega del perro y hoy (por defecto, hoy). Adopción no finalizada o que ya tiene historia → 409.
      operationId: publicarHistoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solicitud_id, titulo, relato, foto_url]
              properties:
                solicitud_id: { type: integer, description: id de la adopción finalizada. }
                titulo: { type: string, maxLength: 120 }
                relato: { type: string, maxLength: 2000 }
                foto_url: { type: string, format: uri, maxLength: 500, pattern: '^https?://' }
                fecha_publicacion: { type: string, format: date }
                visible: { type: boolean, default: true }
            example:
              solicitud_id: 4
              titulo: Toby ya tiene familia
              relato: Toby duerme en el sillón y sale a pasear todas las tardes.
              foto_url: https://images.dog.ceo/breeds/beagle/n02088364_11136.jpg
      responses:
        '201':
          description: Historia publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Historia' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /historias/candidatas:
    servers: *srvAdopcion
    get:
      tags: [Historias]
      summary: Adopciones finalizadas sin historia
      description: HU-14. Las que se pueden elegir al publicar, de la entrega más reciente a la más antigua.
      operationId: adopcionesSinHistoria
      responses:
        '200':
          description: Adopciones
          content:
            application/json:
              schema:
                type: object
                required: [total, adopciones]
                properties:
                  total: { type: integer, example: 1 }
                  adopciones:
                    type: array
                    items:
                      type: object
                      required: [solicitud_id, fecha_adopcion, perro_id, perro_nombre, perro_foto_url, adoptante_nombre]
                      properties:
                        solicitud_id: { type: integer }
                        fecha_adopcion: { type: string, format: date }
                        perro_id: { type: integer }
                        perro_nombre: { type: string, example: Toby }
                        perro_foto_url: { type: [string, 'null'] }
                        adoptante_nombre: { type: string, example: Laura Quispe }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /historias/{id}:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Historias]
      summary: Detalle de una historia
      operationId: obtenerHistoria
      responses:
        '200':
          description: Historia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Historia' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Historias]
      summary: Editar, ocultar o volver a mostrar una historia
      description: |
        HU-14. Cambia solo los campos enviados (al menos uno). `visible: false` la oculta del catálogo público sin
        borrarla; `visible: true` la vuelve a mostrar. Las historias no se borran.
      operationId: actualizarHistoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                titulo: { type: string, maxLength: 120 }
                relato: { type: string, maxLength: 2000 }
                foto_url: { type: string, format: uri, maxLength: 500, pattern: '^https?://' }
                fecha_publicacion: { type: string, format: date }
                visible: { type: boolean }
            example: { visible: false }
      responses:
        '200':
          description: Historia actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Historia' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ───────────────────────── Adopción · seguimientos (HU-10) ─────────────────────────
  /adopciones/{id}/seguimientos:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Seguimientos]
      summary: Seguimientos de una adopción
      description: HU-10 · seguimiento. Visitas y llamadas de la adopción, de la más reciente a la más antigua.
      operationId: listarSeguimientos
      responses:
        '200':
          description: Seguimientos
          content:
            application/json:
              schema:
                type: object
                required: [total, seguimientos]
                properties:
                  total: { type: integer, example: 3 }
                  seguimientos:
                    type: array
                    items: { $ref: '#/components/schemas/Seguimiento' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Seguimientos]
      summary: Registrar un seguimiento
      description: |
        HU-10 · seguimiento. Solo en adopciones `finalizada` (perro entregado); si no, 409.
        La fecha no puede ser anterior a la entrega ni futura. `con_problemas: true` lo deja marcado para revisarlo.
      operationId: registrarSeguimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, observaciones]
              properties:
                tipo: { type: string, enum: [visita, llamada] }
                observaciones: { type: string, maxLength: 2000 }
                fecha: { type: string, format: date, description: Hoy si no se indica. }
                con_problemas: { type: boolean, default: false }
            example: { tipo: visita, observaciones: Rocky está bien y el patio está cercado., con_problemas: false }
      responses:
        '201':
          description: Seguimiento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seguimiento' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /adopciones/{id}/seguimientos/{seguimientoId}:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: seguimientoId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      tags: [Seguimientos]
      summary: Marcar o desmarcar "con problemas"
      description: HU-10 · seguimiento. `true` lo marca para revisarlo; `false` indica que ya se revisó. 404 si el seguimiento no es de esa adopción.
      operationId: marcarProblemasSeguimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [con_problemas]
              properties:
                con_problemas: { type: boolean }
            example: { con_problemas: true }
      responses:
        '200':
          description: Seguimiento actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seguimiento' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /seguimientos/pendientes:
    servers: *srvAdopcion
    get:
      tags: [Seguimientos]
      summary: Adopciones sin seguimiento reciente
      description: >-
        HU-10 · seguimiento. Adopciones finalizadas sin seguimiento en los últimos `dias` días. Si nunca tuvieron
        uno, los días se cuentan desde la entrega. Ordenadas de la que lleva más días sin seguimiento a la que menos.
      operationId: adopcionesSinSeguimiento
      parameters:
        - name: dias
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: Adopciones sin seguimiento
          content:
            application/json:
              schema:
                type: object
                required: [dias, total, adopciones]
                properties:
                  dias: { type: integer, example: 30 }
                  total: { type: integer, example: 1 }
                  adopciones:
                    type: array
                    items: { $ref: '#/components/schemas/AdopcionSinSeguimiento' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /seguimientos/con-problemas:
    servers: *srvAdopcion
    get:
      tags: [Seguimientos]
      summary: Seguimientos con problemas por revisar
      description: HU-10 · seguimiento. Seguimientos marcados `con_problemas`, con perro y adoptante, del más reciente al más antiguo.
      operationId: seguimientosConProblemas
      responses:
        '200':
          description: Seguimientos con problemas
          content:
            application/json:
              schema:
                type: object
                required: [total, seguimientos]
                properties:
                  total: { type: integer, example: 1 }
                  seguimientos:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Seguimiento'
                        - type: object
                          properties:
                            perro_id: { type: integer }
                            perro_nombre: { type: string, example: Rocky }
                            perro_foto_url: { type: [string, 'null'] }
                            adoptante_nombre: { type: string, example: Ana García López }
                            adoptante_telefono: { type: string, example: '76543210' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  # ───────────────────────── Adopción · catálogo público (HU-09) ─────────────────────────
  /publico/filtros:
    servers: *srvAdopcion
    get:
      tags: [Catálogo público]
      summary: Opciones de los filtros del catálogo
      operationId: filtrosCatalogo
      security: []
      responses:
        '200':
          description: Tamaños, sexos y rangos de edad
          content:
            application/json:
              schema:
                type: object
                required: [tamanos, sexos, edades]
                properties:
                  tamanos: { type: array, items: { $ref: '#/components/schemas/Codigo' } }
                  sexos: { type: array, items: { $ref: '#/components/schemas/Codigo' } }
                  edades:
                    type: array
                    description: "cachorro (< 12 meses), joven (12–35), adulto (36–95), senior (≥ 96)."
                    items: { $ref: '#/components/schemas/Codigo' }

  /publico/perros:
    servers: *srvAdopcion
    get:
      tags: [Catálogo público]
      summary: Perros disponibles para adopción
      description: >-
        HU-09. Solo perros en estado `disponible` y solo datos públicos. Con filtro de edad no salen
        los perros de edad desconocida. Del ingreso más antiguo al más reciente.
      operationId: catalogoPerros
      security: []
      parameters:
        - { name: tamano, in: query, required: false, schema: { type: string, example: pequeno } }
        - { name: sexo, in: query, required: false, schema: { type: string, enum: [macho, hembra] } }
        - { name: edad, in: query, required: false, schema: { type: string, enum: [cachorro, joven, adulto, senior] } }
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                required: [total, perros]
                properties:
                  total: { type: integer, example: 4 }
                  perros: { type: array, items: { $ref: '#/components/schemas/PerroPublico' } }
        '400': { $ref: '#/components/responses/Validacion' }

  /publico/perros/{id}:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Catálogo público]
      summary: Ficha pública de un perro
      description: HU-09. 404 si el perro no existe o ya no está disponible.
      operationId: catalogoPerro
      security: []
      responses:
        '200':
          description: Ficha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerroPublico' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /publico/historias:
    servers: *srvAdopcion
    get:
      tags: [Catálogo público]
      summary: Historias de adopciones exitosas
      description: >-
        HU-14. Solo las historias visibles, de la más reciente a la más antigua (por fecha de publicación).
        Sin datos del adoptante ni del personal.
      operationId: catalogoHistorias
      security: []
      responses:
        '200':
          description: Historias visibles
          content:
            application/json:
              schema:
                type: object
                required: [total, historias]
                properties:
                  total: { type: integer, example: 1 }
                  historias: { type: array, items: { $ref: '#/components/schemas/HistoriaPublica' } }

  /publico/solicitudes:
    servers: *srvAdopcion
    post:
      tags: [Catálogo público]
      summary: Enviar solicitud de adopción desde la ficha
      description: >-
        HU-09. Guarda una pre-solicitud `pendiente` (no crea la adopción ni cambia el perro). La misma persona
        (teléfono) no puede repetir una solicitud pendiente del mismo perro (409). Limitado por IP
        (`SOLICITUDES_PUBLICAS_MAXIMO` por `SOLICITUDES_PUBLICAS_VENTANA_MINUTOS`, 5 por hora por defecto) → 429.
        `sitio_web` es un campo trampa para bots: si llega con texto se responde 201 sin guardar nada.
      operationId: enviarSolicitudPublica
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perro_id, nombre_completo, telefono]
              properties:
                perro_id: { type: integer, example: 5 }
                nombre_completo: { type: string, maxLength: 150, example: Laura Quispe }
                telefono: { type: string, description: 7 a 15 dígitos; puede empezar con `+`. Se ignoran espacios y guiones., example: '70012345' }
                correo: { type: [string, 'null'], format: email }
                mensaje: { type: [string, 'null'], maxLength: 1000, example: Tengo patio grande. }
                sitio_web: { type: string, description: Campo trampa; debe ir vacío. }
      responses:
        '201':
          description: Solicitud recibida
          content:
            application/json:
              schema:
                type: object
                required: [mensaje]
                properties:
                  mensaje: { type: string, example: '¡Gracias! Recibimos tu solicitud para adoptar a Coco. El albergue te contactará pronto.' }
        '400': { $ref: '#/components/responses/Validacion' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '429':
          description: Demasiadas solicitudes desde la misma IP. Incluye la cabecera `Retry-After` (segundos).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /solicitudes-publicas:
    servers: *srvAdopcion
    get:
      tags: [Solicitudes web]
      summary: Bandeja de solicitudes del catálogo
      description: HU-09. Pendientes primero; dentro de cada estado, la más reciente primero.
      operationId: listarSolicitudesPublicas
      parameters:
        - { name: estado, in: query, required: false, schema: { type: string, enum: [pendiente, convertida, descartada] } }
      responses:
        '200':
          description: Solicitudes
          content:
            application/json:
              schema:
                type: object
                required: [total, solicitudes]
                properties:
                  total: { type: integer, example: 2 }
                  solicitudes: { type: array, items: { $ref: '#/components/schemas/SolicitudPublica' } }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /solicitudes-publicas/{id}:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Solicitudes web]
      summary: Detalle de una solicitud del catálogo
      operationId: obtenerSolicitudPublica
      responses:
        '200':
          description: Solicitud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudPublica' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /solicitudes-publicas/{id}/descartar:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Solicitudes web]
      summary: Descartar una solicitud del catálogo
      description: HU-09. Solo si está pendiente (409 si ya fue revisada). Guarda quién y cuándo la revisó.
      operationId: descartarSolicitudPublica
      responses:
        '200':
          description: Solicitud descartada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudPublica' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ───────────────────────── Veterinaria ─────────────────────────
  /veterinarios:
    servers: &srvVet
      - url: http://localhost:3001
        description: Veterinaria
    get:
      tags: [Veterinaria]
      summary: Veterinarios activos
      description: HU-09 · RF-12. Lista para elegir el responsable de una atención.
      operationId: listarVeterinarios
      responses:
        '200':
          description: Veterinarios
          content:
            application/json:
              schema:
                type: object
                required: [veterinarios]
                properties:
                  veterinarios:
                    type: array
                    items:
                      type: object
                      required: [id, nombre_completo]
                      properties:
                        id: { type: integer, example: 2 }
                        nombre_completo: { type: string, example: Andrés Ramírez }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /perros/{id}/historial:
    servers: *srvVet
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Veterinaria]
      summary: Historial médico de un perro
      description: "RF-11. Atenciones de la más reciente a la más antigua. HU-08: también las vacunas y desparasitaciones, de la más reciente a la más antigua."
      operationId: historialMedico
      responses:
        '200':
          description: Historial
          content:
            application/json:
              schema:
                type: object
                required: [perro_id, total, consultas, vacunas, desparasitaciones]
                properties:
                  perro_id: { type: integer, example: 4 }
                  total: { type: integer, example: 2, description: Número de consultas. }
                  consultas:
                    type: array
                    items: { $ref: '#/components/schemas/Consulta' }
                  vacunas:
                    type: array
                    items: { $ref: '#/components/schemas/Vacuna' }
                  desparasitaciones:
                    type: array
                    items: { $ref: '#/components/schemas/Desparasitacion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /consultas:
    servers: *srvVet
    post:
      tags: [Veterinaria]
      summary: Registrar atención médica
      description: "HU-09 · RF-12. El responsable debe ser un usuario activo con rol veterinario. HU-07: solo administrador y veterinario pueden registrar (403 para responsable_adopciones)."
      operationId: registrarConsulta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perro_id, veterinario_id, motivo, diagnostico, tratamiento]
              properties:
                perro_id: { type: integer, example: 4 }
                veterinario_id: { type: integer, example: 2 }
                fecha: { type: string, format: date, description: Hoy si no se indica. }
                motivo: { type: string, maxLength: 200, example: Control }
                diagnostico: { type: string, maxLength: 2000, example: Sano }
                tratamiento: { type: string, maxLength: 2000, example: Ninguno }
                observaciones: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201':
          description: Atención registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consulta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /controles/pendientes:
    servers: *srvVet
    get:
      tags: [Veterinaria]
      summary: Controles pendientes (vacunas y desparasitaciones)
      description: >-
        HU-08. Último control de cada vacuna (por nombre, sin distinguir mayúsculas) y de cada tipo de
        desparasitación de cada perro con fecha programada: los vencidos y los que vencen dentro de `dias` días.
        Al registrar el mismo control de nuevo, el anterior sale de la lista. No incluye perros adoptados.
        Ordenados por fecha programada. Solo administrador y veterinario.
      operationId: controlesPendientes
      parameters:
        - name: dias
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 365, default: 30 }
      responses:
        '200':
          description: Controles pendientes
          content:
            application/json:
              schema:
                type: object
                required: [dias, total, vencidos, controles]
                properties:
                  dias: { type: integer, example: 30 }
                  total: { type: integer, example: 3 }
                  vencidos: { type: integer, example: 2 }
                  controles:
                    type: array
                    items: { $ref: '#/components/schemas/ControlPendiente' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /vacunas:
    servers: *srvVet
    post:
      tags: [Veterinaria]
      summary: Registrar vacuna
      description: HU-08. Con `fecha_proxima_dosis`, la vacuna aparecerá en los controles pendientes. Solo administrador y veterinario.
      operationId: registrarVacuna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perro_id, veterinario_id, nombre]
              properties:
                perro_id: { type: integer, example: 4 }
                veterinario_id: { type: integer, example: 2 }
                nombre: { type: string, maxLength: 100, example: Antirrábica }
                fecha_aplicacion: { type: string, format: date, description: Hoy si no se indica. }
                fecha_proxima_dosis: { type: [string, 'null'], format: date, description: Posterior a la fecha de aplicación. }
                observaciones: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201':
          description: Vacuna registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacuna' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /desparasitaciones:
    servers: *srvVet
    post:
      tags: [Veterinaria]
      summary: Registrar desparasitación
      description: HU-08. Con `fecha_proxima`, aparecerá en los controles pendientes. Solo administrador y veterinario.
      operationId: registrarDesparasitacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perro_id, veterinario_id, tipo, producto]
              properties:
                perro_id: { type: integer, example: 4 }
                veterinario_id: { type: integer, example: 2 }
                tipo: { type: string, enum: [interna, externa] }
                producto: { type: string, maxLength: 100, example: Praziquantel + pirantel }
                fecha_aplicacion: { type: string, format: date, description: Hoy si no se indica. }
                fecha_proxima: { type: [string, 'null'], format: date, description: Posterior a la fecha de aplicación. }
                observaciones: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201':
          description: Desparasitación registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Desparasitacion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /citas:
    servers: *srvVet
    get:
      tags: [Veterinaria]
      summary: Agenda de citas
      description: >-
        HU-11. Citas entre `desde` y `hasta` (incluidas), ordenadas por fecha y hora. Sin parámetros devuelve
        la semana desde hoy. El rango no puede superar 62 días. Solo administrador y veterinario.
      operationId: listarCitas
      parameters:
        - { name: desde, in: query, required: false, schema: { type: string, format: date }, description: Hoy si no se indica. }
        - { name: hasta, in: query, required: false, schema: { type: string, format: date }, description: "`desde` + 6 días si no se indica." }
        - { name: veterinario_id, in: query, required: false, schema: { type: integer } }
        - { name: perro_id, in: query, required: false, schema: { type: integer } }
        - { name: estado, in: query, required: false, schema: { type: string, enum: [programada, atendida, cancelada] } }
      responses:
        '200':
          description: Citas del rango
          content:
            application/json:
              schema:
                type: object
                required: [desde, hasta, total, citas]
                properties:
                  desde: { type: string, format: date }
                  hasta: { type: string, format: date }
                  total: { type: integer, example: 4 }
                  citas:
                    type: array
                    items: { $ref: '#/components/schemas/Cita' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Veterinaria]
      summary: Agendar cita
      description: >-
        HU-11. La hora va en bloques de 30 minutos y no puede haber dos citas vigentes (no canceladas) a la
        misma fecha y hora (409). No se agenda en el pasado ni para un perro adoptado. El responsable debe ser
        un veterinario activo. Solo administrador y veterinario.
      operationId: crearCita
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatosCita' }
      responses:
        '201':
          description: Cita agendada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cita' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409':
          description: El horario ya está ocupado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "Ya hay una cita a las 09:00 de ese día (Consulta de Max). Elige otro horario." }

  /citas/{id}:
    servers: *srvVet
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Veterinaria]
      summary: Detalle de una cita
      description: HU-11. Solo administrador y veterinario.
      operationId: obtenerCita
      responses:
        '200':
          description: Cita
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cita' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Veterinaria]
      summary: Editar cita
      description: HU-11. Solo citas programadas (409 si está atendida o cancelada). Mismas reglas que al agendar.
      operationId: editarCita
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatosCita' }
      responses:
        '200':
          description: Cita actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cita' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /citas/{id}/cancelar:
    servers: *srvVet
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Veterinaria]
      summary: Cancelar cita
      description: HU-11. Solo citas programadas. La cita cancelada libera su horario.
      operationId: cancelarCita
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo_cancelacion: { type: [string, 'null'], maxLength: 500, example: El perro sigue en cuarentena. }
      responses:
        '200':
          description: Cita cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cita' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /citas/{id}/atender:
    servers: *srvVet
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Veterinaria]
      summary: Atender cita (crea la atención en el historial)
      description: >-
        HU-11. Crea la consulta en el historial médico con el perro, el veterinario, la fecha y el motivo de la
        cita, y la marca como atendida, en una sola transacción. Solo citas programadas de hoy o de días anteriores.
      operationId: atenderCita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [diagnostico, tratamiento]
              properties:
                diagnostico: { type: string, maxLength: 2000, example: Otitis en remisión }
                tratamiento: { type: string, maxLength: 2000, example: Continuar gotas 5 días }
                observaciones: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201':
          description: Cita atendida y consulta creada
          content:
            application/json:
              schema:
                type: object
                required: [cita, consulta]
                properties:
                  cita: { $ref: '#/components/schemas/Cita' }
                  consulta: { $ref: '#/components/schemas/Consulta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ───────────────────────── Dashboard ─────────────────────────
  /resumen:
    servers: &srvDash
      - url: http://localhost:3003
        description: Dashboard
    get:
      tags: [Dashboard]
      summary: Indicadores del albergue
      description: |
        HU-13 · RF-03. Total y cantidad por cada estado (también los que tienen 0) e indicadores principales
        del estado actual. "Este mes" (`adopciones_mes`) usa la fecha de la BD.
        HU-12: `periodo` trae los ingresos, adopciones finalizadas, solicitudes recibidas y atenciones médicas
        entre `desde` y `hasta` (por defecto, el mes actual).
      operationId: resumenDashboard
      parameters:
        - { name: desde, in: query, required: false, schema: { type: string, format: date }, description: "Primer día del periodo (por defecto, el 1 del mes actual)." }
        - { name: hasta, in: query, required: false, schema: { type: string, format: date }, description: "Último día del periodo, incluido (por defecto, el último del mes de `desde` o del actual). Máximo 5 años." }
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resumen' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /perros-en-tratamiento:
    servers: *srvDash
    get:
      tags: [Dashboard]
      summary: Perros en tratamiento
      description: HU-14 · RF-04. Del ingreso más antiguo al más reciente.
      operationId: perrosEnTratamiento
      responses:
        '200':
          description: Perros en tratamiento
          content:
            application/json:
              schema:
                type: object
                required: [total, perros]
                properties:
                  total: { type: integer, example: 2 }
                  perros:
                    type: array
                    items:
                      type: object
                      required: [id, nombre, sexo, raza, fecha_ingreso]
                      properties:
                        id: { type: integer }
                        nombre: { type: string, example: Max }
                        sexo: { $ref: '#/components/schemas/Sexo' }
                        raza: { type: string, example: Border Collie }
                        foto_url: { type: [string, 'null'] }
                        fecha_ingreso: { type: string, format: date }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /adopciones-por-mes:
    servers: *srvDash
    get:
      tags: [Dashboard]
      summary: Adopciones finalizadas por mes
      description: HU-13. Últimos 12 meses (incluido el actual), del más antiguo al actual, también los meses con 0.
      operationId: adopcionesPorMes
      responses:
        '200':
          description: Serie mensual
          content:
            application/json:
              schema:
                type: object
                required: [meses]
                properties:
                  meses:
                    type: array
                    items:
                      type: object
                      required: [mes, cantidad]
                      properties:
                        mes: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-10' }
                        cantidad: { type: integer, example: 0 }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /evolucion:
    servers: *srvDash
    get:
      tags: [Dashboard]
      summary: Ingresos y adopciones del periodo
      description: >-
        HU-12. Ingresos de perros y adopciones finalizadas entre `desde` y `hasta` (por defecto, el mes actual),
        por día si el rango es menor a 62 días y por mes si es más largo. Incluye los días o meses con 0.
      operationId: evolucionDashboard
      parameters:
        - { name: desde, in: query, required: false, schema: { type: string, format: date }, description: "Primer día del periodo (por defecto, el 1 del mes actual)." }
        - { name: hasta, in: query, required: false, schema: { type: string, format: date }, description: "Último día del periodo, incluido (por defecto, el último del mes de `desde` o del actual). Máximo 5 años." }
      responses:
        '200':
          description: Serie del periodo
          content:
            application/json:
              schema:
                type: object
                required: [desde, hasta, unidad, total_ingresos, total_adopciones, puntos]
                properties:
                  desde: { type: string, format: date }
                  hasta: { type: string, format: date }
                  unidad: { type: string, enum: [dia, mes] }
                  total_ingresos: { type: integer, example: 3 }
                  total_adopciones: { type: integer, example: 1 }
                  puntos:
                    type: array
                    items:
                      type: object
                      required: [periodo, ingresos, adopciones]
                      properties:
                        periodo: { type: string, description: "'AAAA-MM-DD' por día o 'AAAA-MM' por mes.", example: '2026-11-05' }
                        ingresos: { type: integer, example: 1 }
                        adopciones: { type: integer, example: 0 }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  # ───────────────────────── Voluntariado ─────────────────────────
  /voluntarios:
    servers: &srvVol
      - url: http://localhost:3005
        description: Voluntariado
    get:
      tags: [Voluntariado]
      summary: Listar voluntarios activos
      operationId: listarVoluntarios
      responses:
        '200':
          description: Voluntarios registrados
          content:
            application/json:
              schema:
                type: object
                required: [total, voluntarios]
                properties:
                  total: { type: integer }
                  voluntarios:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        nombre_completo: { type: string }
                        telefono: { type: string }
                        correo: { type: [string, 'null'] }
                        disponibilidad: { type: string }
                        activo: { type: boolean }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Voluntariado]
      summary: Registrar un voluntario
      operationId: registrarVoluntario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_completo, telefono, disponibilidad]
              properties:
                nombre_completo: { type: string, maxLength: 150 }
                telefono: { type: string, example: '+59171234567' }
                correo: { type: [string, 'null'], format: email }
                disponibilidad: { type: string, maxLength: 500, example: 'Lunes y miércoles por la mañana' }
      responses:
        '201':
          description: Voluntario registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  nombre_completo: { type: string }
                  telefono: { type: string }
                  correo: { type: [string, 'null'] }
                  disponibilidad: { type: string }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /turnos:
    servers: *srvVol
    get:
      tags: [Voluntariado]
      summary: Consultar los turnos de hasta siete días
      operationId: calendarioVoluntariado
      parameters:
        - name: desde
          in: query
          required: true
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Turnos del periodo
          content:
            application/json:
              schema:
                type: object
                required: [desde, hasta, total, turnos]
                properties:
                  desde: { type: string, format: date }
                  hasta: { type: string, format: date }
                  total: { type: integer }
                  turnos: { type: array, items: { type: object } }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Voluntariado]
      summary: Asignar un turno a un voluntario
      operationId: asignarTurno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [voluntario_id, fecha, hora_inicio, hora_fin, actividad]
              properties:
                voluntario_id: { type: integer }
                fecha: { type: string, format: date }
                hora_inicio: { type: string, pattern: '^\d{2}:\d{2}$' }
                hora_fin: { type: string, pattern: '^\d{2}:\d{2}$' }
                actividad: { type: string, maxLength: 300 }
      responses:
        '201': { description: Turno asignado }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /horas:
    servers: *srvVol
    get:
      tags: [Voluntariado]
      summary: Obtener horas asignadas por voluntario en un mes
      operationId: horasMensualesVoluntariado
      parameters:
        - name: mes
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-11' }
      responses:
        '200':
          description: Total de horas por persona
          content:
            application/json:
              schema:
                type: object
                required: [mes, total, voluntarios]
                properties:
                  mes: { type: string }
                  total: { type: integer }
                  voluntarios: { type: array, items: { type: object } }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  # ───────────────────────── Salud ─────────────────────────
  /health:
    get:
      tags: [Salud]
      summary: Estado del servicio
      description: Disponible en los cinco puertos; sirve para los healthchecks de Docker.
      operationId: salud
      security: []
      responses:
        '200':
          description: El servicio responde
          content:
            application/json:
              schema:
                type: object
                required: [servicio, estado]
                properties:
                  servicio: { type: string, enum: [autenticacion, veterinaria, adopcion, dashboard, voluntariado] }
                  estado: { type: string, const: ok }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Token de `POST /auth/login`. Dura `SESION_HORAS` (8 h por defecto).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    Validacion:
      description: Datos inválidos (un detalle por campo)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: Datos inválidos.
            detalles:
              - { campo: nombre, mensaje: El nombre es obligatorio. }
              - { campo: fecha_ingreso, mensaje: La fecha de ingreso debe ser una fecha válida (AAAA-MM-DD). }
    NoAutenticado:
      description: Sin sesión, sesión cerrada o vencida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Debes iniciar sesión. }
    Prohibido:
      description: "El rol del usuario no tiene acceso (HU-07). Dashboard: administrador. Adopciones: administrador y responsable_adopciones. Historias: administrador. Registrar atención: administrador y veterinario."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: No tienes permiso para acceder a esta sección. }
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: El perro no existe. }
    Conflicto:
      description: Regla de negocio (perro no disponible, transición no permitida, estado controlado por la adopción)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: No se puede pasar una adopción de "Aprobada" a "Aprobada". }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detalles:
          type: array
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo: { type: [string, 'null'] }
              mensaje: { type: string }

    Rol:
      type: string
      enum: [administrador, veterinario, responsable_adopciones]
    Sexo:
      type: string
      enum: [macho, hembra]
    EstadoPerro:
      type: string
      enum: [disponible, en_tratamiento, en_adopcion, adoptado]
    EstadoAdopcion:
      type: string
      enum: [en_proceso, aprobada, rechazada, finalizada]

    Usuario:
      type: object
      required: [id, nombre_completo, correo, rol]
      properties:
        id: { type: integer, example: 4 }
        nombre_completo: { type: string, example: María Alvarado }
        correo: { type: string, format: email, example: maria.alvarado@peluchin.test }
        rol: { $ref: '#/components/schemas/Rol' }

    RespuestaLogin:
      type: object
      required: [token, expira, usuario]
      properties:
        token: { type: string, example: KbvPH1aJscNdcfHln62juRg6x4zTQzy4NOyciTOVpS0 }
        expira: { type: string, format: date-time }
        usuario: { $ref: '#/components/schemas/Usuario' }

    Codigo:
      type: object
      required: [codigo, nombre]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }

    Catalogos:
      type: object
      required: [razas, tamanos, estados_perro, estados_solicitud]
      properties:
        razas:
          type: array
          items:
            type: object
            required: [id, nombre]
            properties:
              id: { type: integer, example: 1 }
              nombre: { type: string, example: Mestizo }
        tamanos:
          type: array
          items: { $ref: '#/components/schemas/Codigo' }
        estados_perro:
          type: array
          items: { $ref: '#/components/schemas/Codigo' }
        estados_solicitud:
          type: array
          items: { $ref: '#/components/schemas/Codigo' }

    DatosPerro:
      type: object
      required: [nombre, raza_id, sexo, tamano, fecha_ingreso]
      properties:
        nombre: { type: string, maxLength: 80 }
        raza_id: { type: integer }
        sexo: { $ref: '#/components/schemas/Sexo' }
        tamano: { type: string, description: 'Código del catálogo: pequeno, mediano o grande.' }
        fecha_ingreso: { type: string, format: date }
        fecha_nacimiento: { type: [string, 'null'], format: date }
        edad_aproximada:
          type: [object, 'null']
          description: Alternativa a `fecha_nacimiento`; se guarda como fecha estimada.
          properties:
            anios: { type: integer, minimum: 0, maximum: 30 }
            meses: { type: integer, minimum: 0, maximum: 11 }
        color: { type: [string, 'null'], maxLength: 50 }
        foto_url: { type: [string, 'null'], maxLength: 500, description: 'URL http:// o https://' }
        estado:
          type: string
          enum: [disponible, en_tratamiento]
          description: Por defecto `disponible` al registrar.

    Perro:
      type: object
      required: [id, nombre, sexo, raza_id, raza, tamano, fecha_ingreso, estado, estado_nombre]
      properties:
        id: { type: integer, example: 3 }
        nombre: { type: string, example: Bella }
        sexo: { $ref: '#/components/schemas/Sexo' }
        raza_id: { type: integer, example: 2 }
        raza: { type: string, example: Beagle }
        color: { type: [string, 'null'], example: Tricolor }
        tamano: { type: string, example: pequeno }
        tamano_nombre: { type: string, example: Pequeño }
        fecha_nacimiento: { type: [string, 'null'], format: date }
        fecha_nacimiento_estimada: { type: boolean }
        edad_meses: { type: [integer, 'null'], example: 57 }
        fecha_ingreso: { type: string, format: date }
        estado: { $ref: '#/components/schemas/EstadoPerro' }
        estado_nombre: { type: string, example: Disponible }
        foto_url: { type: [string, 'null'] }
        registrado_por: { type: [integer, 'null'] }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }

    PerroPublico:
      type: object
      description: Datos que el catálogo público puede mostrar (sin estado interno ni quién lo registró).
      required: [id, nombre, sexo, raza, tamano, tamano_nombre, edad_meses, fecha_nacimiento_estimada, fecha_ingreso]
      properties:
        id: { type: integer, example: 5 }
        nombre: { type: string, example: Coco }
        sexo: { $ref: '#/components/schemas/Sexo' }
        raza: { type: string, example: Chihuahua }
        tamano: { type: string, example: pequeno }
        tamano_nombre: { type: string, example: Pequeño }
        color: { type: [string, 'null'], example: Café claro }
        foto_url: { type: [string, 'null'] }
        edad_meses: { type: [integer, 'null'], example: 44 }
        fecha_nacimiento_estimada: { type: boolean }
        fecha_ingreso: { type: string, format: date }

    SolicitudPublica:
      type: object
      required: [id, perro_id, perro_nombre, nombre_completo, telefono, estado, creado_en]
      properties:
        id: { type: integer }
        perro_id: { type: integer }
        perro_nombre: { type: string, example: Coco }
        perro_foto_url: { type: [string, 'null'] }
        perro_estado: { $ref: '#/components/schemas/EstadoPerro' }
        nombre_completo: { type: string, example: Laura Quispe }
        telefono: { type: string, example: '70012345' }
        correo: { type: [string, 'null'] }
        mensaje: { type: [string, 'null'] }
        estado: { type: string, enum: [pendiente, convertida, descartada] }
        solicitud_id: { type: [integer, 'null'], description: Adopción creada a partir de esta solicitud. }
        revisado_por: { type: [integer, 'null'] }
        revisado_por_nombre: { type: [string, 'null'] }
        revisado_en: { type: [string, 'null'], format: date-time }
        creado_en: { type: string, format: date-time }

    PerroDetalle:
      allOf:
        - $ref: '#/components/schemas/Perro'
        - type: object
          required: [adopcion_vigente]
          properties:
            adopcion_vigente:
              description: "Adopción en proceso o aprobada; `null` si no tiene. HU-07: siempre `null` para el rol veterinario (trae datos del adoptante)."
              oneOf:
                - $ref: '#/components/schemas/Adopcion'
                - type: 'null'

    Adoptante:
      type: object
      required: [id, nombre_completo, telefono, direccion]
      properties:
        id: { type: integer }
        nombre_completo: { type: string, example: Carlos Mendoza Vargas }
        documento_identidad: { type: [string, 'null'], example: '4875123' }
        telefono: { type: string, example: '71234567' }
        direccion: { type: string, example: 'Av. 6 de Agosto #2170, Sopocachi, La Paz' }

    Adopcion:
      type: object
      required: [id, estado, estado_nombre, fecha_solicitud, perro, adoptante]
      properties:
        id: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoAdopcion' }
        estado_nombre: { type: string, example: En proceso }
        fecha_solicitud: { type: string, format: date }
        fecha_aprobacion: { type: [string, 'null'], format: date }
        fecha_rechazo: { type: [string, 'null'], format: date }
        fecha_adopcion: { type: [string, 'null'], format: date }
        observaciones: { type: [string, 'null'] }
        motivo_rechazo: { type: [string, 'null'], description: HU-13. Solo en rechazadas; se le comunica al adoptante. }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }
        perro:
          type: object
          required: [id, nombre, estado]
          properties:
            id: { type: integer }
            nombre: { type: string }
            raza: { type: string }
            sexo: { $ref: '#/components/schemas/Sexo' }
            tamano: { type: string }
            tamano_nombre: { type: string }
            edad_meses: { type: [integer, 'null'] }
            fecha_nacimiento_estimada: { type: boolean }
            estado: { $ref: '#/components/schemas/EstadoPerro' }
            estado_nombre: { type: string }
            foto_url: { type: [string, 'null'] }
        adoptante: { $ref: '#/components/schemas/Adoptante' }

    AdopcionDetalle:
      allOf:
        - $ref: '#/components/schemas/Adopcion'
        - type: object
          required: [transiciones_permitidas]
          properties:
            transiciones_permitidas:
              type: array
              items: { $ref: '#/components/schemas/EstadoAdopcion' }
              example: [aprobada, rechazada]

    Consulta:
      type: object
      required: [id, perro_id, fecha, motivo, diagnostico, tratamiento, veterinario_id, veterinario_nombre]
      properties:
        id: { type: integer }
        perro_id: { type: integer }
        fecha: { type: string, format: date }
        motivo: { type: string, example: Seguimiento de tratamiento }
        diagnostico: { type: string }
        tratamiento: { type: string }
        observaciones: { type: [string, 'null'] }
        veterinario_id: { type: integer }
        veterinario_nombre: { type: string, example: Andrés Ramírez }
        creado_en: { type: string, format: date-time }

    Vacuna:
      type: object
      required: [id, perro_id, nombre, fecha_aplicacion, fecha_proxima_dosis, veterinario_id, veterinario_nombre]
      properties:
        id: { type: integer }
        perro_id: { type: integer }
        nombre: { type: string, example: Antirrábica }
        fecha_aplicacion: { type: string, format: date }
        fecha_proxima_dosis: { type: [string, 'null'], format: date }
        observaciones: { type: [string, 'null'] }
        veterinario_id: { type: integer }
        veterinario_nombre: { type: string, example: Andrés Ramírez }
        creado_en: { type: string, format: date-time }

    Desparasitacion:
      type: object
      required: [id, perro_id, tipo, producto, fecha_aplicacion, fecha_proxima, veterinario_id, veterinario_nombre]
      properties:
        id: { type: integer }
        perro_id: { type: integer }
        tipo: { type: string, enum: [interna, externa] }
        producto: { type: string, example: Fipronil (pipeta) }
        fecha_aplicacion: { type: string, format: date }
        fecha_proxima: { type: [string, 'null'], format: date }
        observaciones: { type: [string, 'null'] }
        veterinario_id: { type: integer }
        veterinario_nombre: { type: string, example: Lucía Torres }
        creado_en: { type: string, format: date-time }

    DatosCita:
      type: object
      required: [perro_id, veterinario_id, fecha, hora, tipo, motivo]
      properties:
        perro_id: { type: integer, example: 4 }
        veterinario_id: { type: integer, example: 2 }
        fecha: { type: string, format: date, example: '2026-11-20' }
        hora: { type: string, pattern: '^([01][0-9]|2[0-3]):(00|30)$', example: '09:30' }
        tipo: { type: string, enum: [consulta, vacuna, cirugia] }
        motivo: { type: string, maxLength: 200, example: Control de la otitis }

    Cita:
      type: object
      required: [id, perro_id, perro_nombre, veterinario_id, veterinario_nombre, fecha, hora, tipo, motivo, estado]
      properties:
        id: { type: integer }
        perro_id: { type: integer }
        perro_nombre: { type: string, example: Max }
        perro_foto_url: { type: [string, 'null'] }
        veterinario_id: { type: integer }
        veterinario_nombre: { type: string, example: Andrés Ramírez }
        fecha: { type: string, format: date }
        hora: { type: string, example: '09:30' }
        tipo: { type: string, enum: [consulta, vacuna, cirugia] }
        motivo: { type: string }
        estado: { type: string, enum: [programada, atendida, cancelada] }
        motivo_cancelacion: { type: [string, 'null'] }
        consulta_id: { type: [integer, 'null'], description: Consulta del historial creada al atender la cita. }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }

    Seguimiento:
      type: object
      required: [id, solicitud_id, fecha, tipo, observaciones, con_problemas, registrado_por, registrado_por_nombre]
      properties:
        id: { type: integer }
        solicitud_id: { type: integer, description: id de la adopción. }
        fecha: { type: string, format: date }
        tipo: { type: string, enum: [visita, llamada] }
        observaciones: { type: string, example: Rocky cojea de la pata trasera. }
        con_problemas: { type: boolean, description: Marcado para revisarlo. }
        registrado_por: { type: integer }
        registrado_por_nombre: { type: string, example: María Alvarado }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }

    AvisoBorrador:
      type: object
      required: [tipo, telefono, mensaje, enlace_whatsapp]
      properties:
        tipo: { type: string, enum: [aprobacion, rechazo] }
        telefono: { type: string, pattern: '^[0-9]{8,15}$', example: '59168812345', description: Internacional sin +. }
        mensaje:
          type: string
          example: "Hola, Jorge Pérez Ruiz. Le escribimos del albergue Huellas sobre su solicitud para adoptar a Luna.\n\nLamentamos informarle que esta vez no pudimos aprobarla.\nMotivo: La vivienda no tiene espacio adecuado para un perro de su tamaño.\n\nGracias por querer darle un hogar a uno de nuestros perros; puede volver a postular cuando quiera."
        enlace_whatsapp: { type: string, format: uri, example: 'https://wa.me/59168812345?text=Hola%2C%20Jorge...' }

    Aviso:
      allOf:
        - $ref: '#/components/schemas/AvisoBorrador'
        - type: object
          required: [id, solicitud_id, canal, enviado_por, enviado_por_nombre, enviado_en]
          properties:
            id: { type: integer }
            solicitud_id: { type: integer, description: id de la adopción. }
            canal: { type: string, enum: [whatsapp] }
            enviado_por: { type: integer }
            enviado_por_nombre: { type: string, example: María Alvarado }
            enviado_en: { type: string, format: date-time }

    HistoriaPublica:
      type: object
      required: [id, titulo, relato, foto_url, fecha_publicacion, perro_nombre, fecha_adopcion]
      properties:
        id: { type: integer }
        titulo: { type: string, example: Rocky encontró su patio para correr }
        relato: { type: string, example: Rocky llegó al albergue con miedo a la gente y hoy corre todas las mañanas en su patio. }
        foto_url: { type: string, format: uri }
        fecha_publicacion: { type: string, format: date, example: '2024-01-25' }
        perro_nombre: { type: string, example: Rocky }
        fecha_adopcion: { type: string, format: date, example: '2023-12-15' }

    Historia:
      allOf:
        - $ref: '#/components/schemas/HistoriaPublica'
        - type: object
          required: [solicitud_id, visible, perro_id, adoptante_nombre, publicado_por, publicado_por_nombre, creado_en, actualizado_en]
          properties:
            solicitud_id: { type: integer, description: id de la adopción. }
            visible: { type: boolean, description: false = oculta en el catálogo público. }
            perro_id: { type: integer }
            adoptante_nombre: { type: string, example: Ana García López }
            publicado_por: { type: integer }
            publicado_por_nombre: { type: string, example: Patricia Gómez }
            creado_en: { type: string, format: date-time }
            actualizado_en: { type: string, format: date-time }

    AdopcionSinSeguimiento:
      type: object
      required: [solicitud_id, perro_id, perro_nombre, adoptante_nombre, adoptante_telefono, fecha_adopcion, total_seguimientos, ultimo_seguimiento, seguimientos_con_problemas, dias_sin_seguimiento]
      properties:
        solicitud_id: { type: integer }
        perro_id: { type: integer }
        perro_nombre: { type: string, example: Rocky }
        perro_foto_url: { type: [string, 'null'] }
        adoptante_nombre: { type: string, example: Ana García López }
        adoptante_telefono: { type: string, example: '76543210' }
        fecha_adopcion: { type: string, format: date }
        total_seguimientos: { type: integer, example: 3 }
        ultimo_seguimiento: { type: [string, 'null'], format: date }
        seguimientos_con_problemas: { type: integer, example: 1 }
        dias_sin_seguimiento: { type: integer, example: 45, description: 'Desde el último seguimiento o, si no hay ninguno, desde la entrega.' }

    ControlPendiente:
      type: object
      required: [tipo, control_id, perro_id, perro_nombre, detalle, ultima_aplicacion, fecha_programada, dias_restantes, vencido]
      properties:
        tipo: { type: string, enum: [vacuna, desparasitacion] }
        control_id: { type: integer, description: id de la vacuna o desparasitación que programó el control. }
        perro_id: { type: integer }
        perro_nombre: { type: string, example: Toby }
        perro_foto_url: { type: [string, 'null'] }
        perro_estado: { $ref: '#/components/schemas/EstadoPerro' }
        detalle: { type: string, example: Antirrábica, description: 'Nombre de la vacuna o "Desparasitación interna/externa".' }
        ultima_aplicacion: { type: string, format: date }
        fecha_programada: { type: string, format: date }
        dias_restantes: { type: integer, example: -10, description: Negativo si ya venció. }
        vencido: { type: boolean }

    Resumen:
      type: object
      required: [total, por_estado, indicadores, periodo]
      properties:
        total: { type: integer, example: 8 }
        por_estado:
          type: array
          items:
            type: object
            required: [codigo, nombre, cantidad]
            properties:
              codigo: { $ref: '#/components/schemas/EstadoPerro' }
              nombre: { type: string }
              cantidad: { type: integer }
        indicadores:
          type: object
          required: [en_albergue, disponibles, en_tratamiento, adopciones_mes, solicitudes_pendientes]
          properties:
            en_albergue: { type: integer, description: Todos menos los adoptados. }
            disponibles: { type: integer }
            en_tratamiento: { type: integer }
            adopciones_mes: { type: integer, description: Adopciones finalizadas en el mes actual. }
            solicitudes_pendientes: { type: integer, description: Solicitudes en proceso o aprobadas. }
        periodo:
          type: object
          description: HU-12 · Indicadores del rango elegido (fechas incluidas).
          required: [desde, hasta, ingresos, adopciones, solicitudes, atenciones]
          properties:
            desde: { type: string, format: date, example: '2026-11-01' }
            hasta: { type: string, format: date, example: '2026-11-30' }
            ingresos: { type: integer, description: Perros con fecha de ingreso en el periodo. }
            adopciones: { type: integer, description: Adopciones finalizadas en el periodo. }
            solicitudes: { type: integer, description: Solicitudes de adopción registradas en el periodo. }
            atenciones: { type: integer, description: Atenciones médicas (consultas) del periodo. }
