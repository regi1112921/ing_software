openapi: 3.1.0
info:
  title: HUELLAS · API del albergue
  version: 1.0.0
  description: |
    API REST de los cuatro microservicios de HUELLAS. Cada servicio corre en su propio puerto,
    por eso cada ruta declara su `servers` (con Docker Compose o `npm run dev` en `backend/`).

    **Sesión:** todas las rutas, salvo `POST /auth/login`, `POST /auth/registro`, `GET /health` y las del
    catálogo público (`/publico/*`, HU-09), exigen `Authorization: Bearer <token>`. El token se obtiene con `POST /auth/login`.

    **Convenciones:** JSON con campos en `snake_case` (iguales a las columnas de la BD) y fechas `AAAA-MM-DD`.
    Los errores responden `{ "error": "mensaje" }` y, si son de validación, también `detalles` por campo.

    Usuarios de prueba (Docker, contraseña `huellas123`): `maria.alvarado@peluchin.test` (responsable_adopciones),
    `andres.ramirez@peluchin.test` (veterinario) y `admin@peluchin.test` (administrador, el único que ve el Dashboard).
  contact:
    name: Equipo HUELLAS · SIS-213 Ingeniería del Software (UCB)

servers:
  - url: http://localhost:3004
    description: Autenticación
  - url: http://localhost:3002
    description: Adopción
  - url: http://localhost:3001
    description: Veterinaria
  - url: http://localhost:3003
    description: Dashboard

tags:
  - name: Autenticación
    description: "Puerto 3004 · HU-02, HU-03"
  - name: Perros
    description: "Servicio de Adopción, puerto 3002 · HU-04 a HU-07"
  - name: Adopciones
    description: "Servicio de Adopción, puerto 3002 · HU-10 a HU-12"
  - name: Catálogo público
    description: "Servicio de Adopción, puerto 3002 · HU-09. Sin sesión: lo usa el sitio público (Vercel)."
  - name: Solicitudes web
    description: "Servicio de Adopción, puerto 3002 · HU-09. Bandeja privada de las solicitudes del catálogo (administrador y responsable_adopciones)."
  - name: Veterinaria
    description: "Puerto 3001 · HU-08, HU-09"
  - name: Dashboard
    description: "Puerto 3003 · HU-13, HU-14. Solo rol administrador."
  - name: Salud
    description: Todos los servicios exponen `GET /health`.

security:
  - bearer: []

paths:
  # ───────────────────────── Autenticación ─────────────────────────
  /auth/login:
    servers: &srvAuth
      - url: http://localhost:3004
        description: Autenticación
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: "HU-02 · RF-01 y HU-07. Credenciales incorrectas, usuario inactivo o sin contraseña → 401 con el mismo mensaje. En el 2.º intento fallido seguido el mensaje avisa que queda 1 intento; al 3.º la cuenta se bloquea 5 minutos (429). Un login correcto reinicia el contador."
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, contrasena]
              properties:
                correo: { type: string, example: maria.alvarado@peluchin.test }
                contrasena: { type: string, example: huellas123 }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaLogin' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401':
          description: Usuario o contraseña incorrectos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Usuario o contraseña incorrectos. }
        '429':
          description: Cuenta bloqueada por intentos fallidos (HU-07). Mientras dura el bloqueo responde 429 aunque la contraseña sea correcta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Demasiados intentos fallidos. La cuenta está bloqueada; vuelve a intentarlo en 5 minutos.' }

  /auth/registro:
    servers: *srvAuth
    post:
      tags: [Autenticación]
      summary: Crear cuenta (rol responsable_adopciones)
      description: Crea una cuenta siempre con rol `responsable_adopciones` y deja la sesión iniciada (misma respuesta que el login).
      operationId: registrarse
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_completo, correo, contrasena]
              properties:
                nombre_completo: { type: string, maxLength: 150, example: Sofía Quispe }
                correo: { type: string, format: email, example: sofia.quispe@peluchin.test }
                contrasena: { type: string, minLength: 8, maxLength: 72, example: Clave-Segura-1 }
      responses:
        '201':
          description: Cuenta creada y sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaLogin' }
        '400': { $ref: '#/components/responses/Validacion' }
        '409':
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    servers: *srvAuth
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: HU-03 · RF-02. Invalida el token enviado.
      operationId: cerrarSesion
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /auth/sesion:
    servers: *srvAuth
    get:
      tags: [Autenticación]
      summary: Usuario de la sesión
      description: La usan el frontend (nombre y rol para el menú) y los demás servicios para validar el token.
      operationId: obtenerSesion
      responses:
        '200':
          description: Sesión válida
          content:
            application/json:
              schema:
                type: object
                required: [usuario]
                properties:
                  usuario: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  # ───────────────────────── Adopción · perros ─────────────────────────
  /catalogos:
    servers: &srvAdopcion
      - url: http://localhost:3002
        description: Adopción
    get:
      tags: [Perros]
      summary: Catálogos para los formularios
      description: HU-04. Razas activas, tamaños y estados del perro y de la adopción.
      operationId: listarCatalogos
      responses:
        '200':
          description: Catálogos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalogos' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /perros:
    servers: *srvAdopcion
    get:
      tags: [Perros]
      summary: Listar, buscar y filtrar perros
      description: HU-06 · RF-07, RF-08, RF-09.
      operationId: listarPerros
      parameters:
        - name: buscar
          in: query
          description: Busca por nombre o raza (sin distinguir mayúsculas).
          schema: { type: string, maxLength: 100 }
        - name: estado
          in: query
          description: Código del estado.
          schema: { $ref: '#/components/schemas/EstadoPerro' }
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                required: [total, perros]
                properties:
                  total: { type: integer, example: 8 }
                  perros:
                    type: array
                    items: { $ref: '#/components/schemas/Perro' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Perros]
      summary: Registrar perro
      description: |
        HU-04 · RF-05. Se indica `fecha_nacimiento` **o** `edad_aproximada` (no ambas).
        El estado solo puede ser `disponible` (por defecto) o `en_tratamiento`; los de adopción los asigna el proceso de adopción.
      operationId: registrarPerro
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatosPerro' }
            example:
              nombre: Firulais
              raza_id: 1
              sexo: macho
              tamano: mediano
              fecha_ingreso: '2026-10-01'
              edad_aproximada: { anios: 2, meses: 0 }
              color: Marrón
      responses:
        '201':
          description: Perro registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerroDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /perros/{id}:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Perros]
      summary: Ficha de un perro
      description: HU-07 · RF-10. Incluye la adopción vigente (en proceso o aprobada), si la hay.
      operationId: obtenerPerro
      responses:
        '200':
          description: Ficha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerroDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Perros]
      summary: Editar perro
      description: |
        HU-05 · RF-06. Mismos campos que el registro. `estado` es opcional y solo puede ser
        `disponible` o `en_tratamiento`; si el perro tiene una adopción en curso o ya fue adoptado responde 409.
      operationId: editarPerro
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatosPerro' }
      responses:
        '200':
          description: Perro actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerroDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ───────────────────────── Adopción · adopciones ─────────────────────────
  /adopciones:
    servers: *srvAdopcion
    get:
      tags: [Adopciones]
      summary: Listar adopciones
      description: HU-11 · RF-15. De la solicitud más reciente a la más antigua.
      operationId: listarAdopciones
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                required: [total, adopciones]
                properties:
                  total: { type: integer, example: 3 }
                  adopciones:
                    type: array
                    items: { $ref: '#/components/schemas/Adopcion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Adopciones]
      summary: Registrar adopción
      description: |
        HU-10 · RF-13, RF-14, RF-19. Solo para perros `disponible`. Siempre se crea `en_proceso`
        y el perro pasa a `en_adopcion`. Si el `documento_identidad` ya existe, se reutiliza ese adoptante.
      operationId: registrarAdopcion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perro_id, adoptante]
              properties:
                perro_id: { type: integer, example: 6 }
                adoptante:
                  type: object
                  required: [nombre_completo, telefono, direccion]
                  properties:
                    nombre_completo: { type: string, maxLength: 150, example: Laura Ríos }
                    documento_identidad: { type: [string, 'null'], maxLength: 30, example: '9123456' }
                    telefono:
                      type: string
                      description: 7 a 15 dígitos; puede empezar con `+`. Se ignoran espacios y guiones.
                      example: '71112233'
                    direccion: { type: string, maxLength: 250, example: 'Calle 1, La Paz' }
                fecha_solicitud: { type: string, format: date, description: Hoy si no se indica. }
                observaciones: { type: [string, 'null'], maxLength: 2000 }
                solicitud_publica_id:
                  type: [integer, 'null']
                  description: "HU-09: solicitud del catálogo público de la que nace la adopción. Debe estar pendiente y ser del mismo perro; queda `convertida` en la misma transacción."
      responses:
        '201':
          description: Adopción registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdopcionDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /adopciones/{id}:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Adopciones]
      summary: Detalle de una adopción
      description: HU-11 · RF-16. Incluye `transiciones_permitidas` desde el estado actual.
      operationId: obtenerAdopcion
      responses:
        '200':
          description: Detalle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdopcionDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /adopciones/{id}/estado:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Adopciones]
      summary: Cambiar el estado de una adopción
      description: |
        HU-12 · RF-17, RF-18, RF-19, RF-20. Transiciones: `en_proceso → aprobada | rechazada`,
        `aprobada → finalizada | rechazada`. Al finalizar, el perro pasa a `adoptado`; al rechazar, vuelve a `disponible`.
      operationId: cambiarEstadoAdopcion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [aprobada, rechazada, finalizada] }
                fecha: { type: string, format: date, description: Hoy si no se indica. }
                observaciones: { type: [string, 'null'], maxLength: 2000 }
            example: { estado: aprobada }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdopcionDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ───────────────────────── Adopción · catálogo público (HU-09) ─────────────────────────
  /publico/filtros:
    servers: *srvAdopcion
    get:
      tags: [Catálogo público]
      summary: Opciones de los filtros del catálogo
      operationId: filtrosCatalogo
      security: []
      responses:
        '200':
          description: Tamaños, sexos y rangos de edad
          content:
            application/json:
              schema:
                type: object
                required: [tamanos, sexos, edades]
                properties:
                  tamanos: { type: array, items: { $ref: '#/components/schemas/Codigo' } }
                  sexos: { type: array, items: { $ref: '#/components/schemas/Codigo' } }
                  edades:
                    type: array
                    description: "cachorro (< 12 meses), joven (12–35), adulto (36–95), senior (≥ 96)."
                    items: { $ref: '#/components/schemas/Codigo' }

  /publico/perros:
    servers: *srvAdopcion
    get:
      tags: [Catálogo público]
      summary: Perros disponibles para adopción
      description: >-
        HU-09. Solo perros en estado `disponible` y solo datos públicos. Con filtro de edad no salen
        los perros de edad desconocida. Del ingreso más antiguo al más reciente.
      operationId: catalogoPerros
      security: []
      parameters:
        - { name: tamano, in: query, required: false, schema: { type: string, example: pequeno } }
        - { name: sexo, in: query, required: false, schema: { type: string, enum: [macho, hembra] } }
        - { name: edad, in: query, required: false, schema: { type: string, enum: [cachorro, joven, adulto, senior] } }
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                required: [total, perros]
                properties:
                  total: { type: integer, example: 4 }
                  perros: { type: array, items: { $ref: '#/components/schemas/PerroPublico' } }
        '400': { $ref: '#/components/responses/Validacion' }

  /publico/perros/{id}:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Catálogo público]
      summary: Ficha pública de un perro
      description: HU-09. 404 si el perro no existe o ya no está disponible.
      operationId: catalogoPerro
      security: []
      responses:
        '200':
          description: Ficha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerroPublico' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /publico/solicitudes:
    servers: *srvAdopcion
    post:
      tags: [Catálogo público]
      summary: Enviar solicitud de adopción desde la ficha
      description: >-
        HU-09. Guarda una pre-solicitud `pendiente` (no crea la adopción ni cambia el perro). La misma persona
        (teléfono) no puede repetir una solicitud pendiente del mismo perro (409). Limitado por IP
        (`SOLICITUDES_PUBLICAS_MAXIMO` por `SOLICITUDES_PUBLICAS_VENTANA_MINUTOS`, 5 por hora por defecto) → 429.
        `sitio_web` es un campo trampa para bots: si llega con texto se responde 201 sin guardar nada.
      operationId: enviarSolicitudPublica
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perro_id, nombre_completo, telefono]
              properties:
                perro_id: { type: integer, example: 5 }
                nombre_completo: { type: string, maxLength: 150, example: Laura Quispe }
                telefono: { type: string, description: 7 a 15 dígitos; puede empezar con `+`. Se ignoran espacios y guiones., example: '70012345' }
                correo: { type: [string, 'null'], format: email }
                mensaje: { type: [string, 'null'], maxLength: 1000, example: Tengo patio grande. }
                sitio_web: { type: string, description: Campo trampa; debe ir vacío. }
      responses:
        '201':
          description: Solicitud recibida
          content:
            application/json:
              schema:
                type: object
                required: [mensaje]
                properties:
                  mensaje: { type: string, example: '¡Gracias! Recibimos tu solicitud para adoptar a Coco. El albergue te contactará pronto.' }
        '400': { $ref: '#/components/responses/Validacion' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '429':
          description: Demasiadas solicitudes desde la misma IP. Incluye la cabecera `Retry-After` (segundos).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /solicitudes-publicas:
    servers: *srvAdopcion
    get:
      tags: [Solicitudes web]
      summary: Bandeja de solicitudes del catálogo
      description: HU-09. Pendientes primero; dentro de cada estado, la más reciente primero.
      operationId: listarSolicitudesPublicas
      parameters:
        - { name: estado, in: query, required: false, schema: { type: string, enum: [pendiente, convertida, descartada] } }
      responses:
        '200':
          description: Solicitudes
          content:
            application/json:
              schema:
                type: object
                required: [total, solicitudes]
                properties:
                  total: { type: integer, example: 2 }
                  solicitudes: { type: array, items: { $ref: '#/components/schemas/SolicitudPublica' } }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /solicitudes-publicas/{id}:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Solicitudes web]
      summary: Detalle de una solicitud del catálogo
      operationId: obtenerSolicitudPublica
      responses:
        '200':
          description: Solicitud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudPublica' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /solicitudes-publicas/{id}/descartar:
    servers: *srvAdopcion
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Solicitudes web]
      summary: Descartar una solicitud del catálogo
      description: HU-09. Solo si está pendiente (409 si ya fue revisada). Guarda quién y cuándo la revisó.
      operationId: descartarSolicitudPublica
      responses:
        '200':
          description: Solicitud descartada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudPublica' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ───────────────────────── Veterinaria ─────────────────────────
  /veterinarios:
    servers: &srvVet
      - url: http://localhost:3001
        description: Veterinaria
    get:
      tags: [Veterinaria]
      summary: Veterinarios activos
      description: HU-09 · RF-12. Lista para elegir el responsable de una atención.
      operationId: listarVeterinarios
      responses:
        '200':
          description: Veterinarios
          content:
            application/json:
              schema:
                type: object
                required: [veterinarios]
                properties:
                  veterinarios:
                    type: array
                    items:
                      type: object
                      required: [id, nombre_completo]
                      properties:
                        id: { type: integer, example: 2 }
                        nombre_completo: { type: string, example: Andrés Ramírez }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /perros/{id}/historial:
    servers: *srvVet
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Veterinaria]
      summary: Historial médico de un perro
      description: "RF-11. Atenciones de la más reciente a la más antigua. HU-08: también las vacunas y desparasitaciones, de la más reciente a la más antigua."
      operationId: historialMedico
      responses:
        '200':
          description: Historial
          content:
            application/json:
              schema:
                type: object
                required: [perro_id, total, consultas, vacunas, desparasitaciones]
                properties:
                  perro_id: { type: integer, example: 4 }
                  total: { type: integer, example: 2, description: Número de consultas. }
                  consultas:
                    type: array
                    items: { $ref: '#/components/schemas/Consulta' }
                  vacunas:
                    type: array
                    items: { $ref: '#/components/schemas/Vacuna' }
                  desparasitaciones:
                    type: array
                    items: { $ref: '#/components/schemas/Desparasitacion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /consultas:
    servers: *srvVet
    post:
      tags: [Veterinaria]
      summary: Registrar atención médica
      description: "HU-09 · RF-12. El responsable debe ser un usuario activo con rol veterinario. HU-07: solo administrador y veterinario pueden registrar (403 para responsable_adopciones)."
      operationId: registrarConsulta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perro_id, veterinario_id, motivo, diagnostico, tratamiento]
              properties:
                perro_id: { type: integer, example: 4 }
                veterinario_id: { type: integer, example: 2 }
                fecha: { type: string, format: date, description: Hoy si no se indica. }
                motivo: { type: string, maxLength: 200, example: Control }
                diagnostico: { type: string, maxLength: 2000, example: Sano }
                tratamiento: { type: string, maxLength: 2000, example: Ninguno }
                observaciones: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201':
          description: Atención registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consulta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /controles/pendientes:
    servers: *srvVet
    get:
      tags: [Veterinaria]
      summary: Controles pendientes (vacunas y desparasitaciones)
      description: >-
        HU-08. Último control de cada vacuna (por nombre, sin distinguir mayúsculas) y de cada tipo de
        desparasitación de cada perro con fecha programada: los vencidos y los que vencen dentro de `dias` días.
        Al registrar el mismo control de nuevo, el anterior sale de la lista. No incluye perros adoptados.
        Ordenados por fecha programada. Solo administrador y veterinario.
      operationId: controlesPendientes
      parameters:
        - name: dias
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 365, default: 30 }
      responses:
        '200':
          description: Controles pendientes
          content:
            application/json:
              schema:
                type: object
                required: [dias, total, vencidos, controles]
                properties:
                  dias: { type: integer, example: 30 }
                  total: { type: integer, example: 3 }
                  vencidos: { type: integer, example: 2 }
                  controles:
                    type: array
                    items: { $ref: '#/components/schemas/ControlPendiente' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /vacunas:
    servers: *srvVet
    post:
      tags: [Veterinaria]
      summary: Registrar vacuna
      description: HU-08. Con `fecha_proxima_dosis`, la vacuna aparecerá en los controles pendientes. Solo administrador y veterinario.
      operationId: registrarVacuna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perro_id, veterinario_id, nombre]
              properties:
                perro_id: { type: integer, example: 4 }
                veterinario_id: { type: integer, example: 2 }
                nombre: { type: string, maxLength: 100, example: Antirrábica }
                fecha_aplicacion: { type: string, format: date, description: Hoy si no se indica. }
                fecha_proxima_dosis: { type: [string, 'null'], format: date, description: Posterior a la fecha de aplicación. }
                observaciones: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201':
          description: Vacuna registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacuna' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /desparasitaciones:
    servers: *srvVet
    post:
      tags: [Veterinaria]
      summary: Registrar desparasitación
      description: HU-08. Con `fecha_proxima`, aparecerá en los controles pendientes. Solo administrador y veterinario.
      operationId: registrarDesparasitacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perro_id, veterinario_id, tipo, producto]
              properties:
                perro_id: { type: integer, example: 4 }
                veterinario_id: { type: integer, example: 2 }
                tipo: { type: string, enum: [interna, externa] }
                producto: { type: string, maxLength: 100, example: Praziquantel + pirantel }
                fecha_aplicacion: { type: string, format: date, description: Hoy si no se indica. }
                fecha_proxima: { type: [string, 'null'], format: date, description: Posterior a la fecha de aplicación. }
                observaciones: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201':
          description: Desparasitación registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Desparasitacion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  # ───────────────────────── Dashboard ─────────────────────────
  /resumen:
    servers: &srvDash
      - url: http://localhost:3003
        description: Dashboard
    get:
      tags: [Dashboard]
      summary: Indicadores del albergue
      description: |
        HU-13 · RF-03. Total y cantidad por cada estado (también los que tienen 0) e indicadores principales.
        "Este mes" usa la fecha de la BD.
      operationId: resumenDashboard
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resumen' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /perros-en-tratamiento:
    servers: *srvDash
    get:
      tags: [Dashboard]
      summary: Perros en tratamiento
      description: HU-14 · RF-04. Del ingreso más antiguo al más reciente.
      operationId: perrosEnTratamiento
      responses:
        '200':
          description: Perros en tratamiento
          content:
            application/json:
              schema:
                type: object
                required: [total, perros]
                properties:
                  total: { type: integer, example: 2 }
                  perros:
                    type: array
                    items:
                      type: object
                      required: [id, nombre, sexo, raza, fecha_ingreso]
                      properties:
                        id: { type: integer }
                        nombre: { type: string, example: Max }
                        sexo: { $ref: '#/components/schemas/Sexo' }
                        raza: { type: string, example: Border Collie }
                        foto_url: { type: [string, 'null'] }
                        fecha_ingreso: { type: string, format: date }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /adopciones-por-mes:
    servers: *srvDash
    get:
      tags: [Dashboard]
      summary: Adopciones finalizadas por mes
      description: HU-13. Últimos 12 meses (incluido el actual), del más antiguo al actual, también los meses con 0.
      operationId: adopcionesPorMes
      responses:
        '200':
          description: Serie mensual
          content:
            application/json:
              schema:
                type: object
                required: [meses]
                properties:
                  meses:
                    type: array
                    items:
                      type: object
                      required: [mes, cantidad]
                      properties:
                        mes: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-10' }
                        cantidad: { type: integer, example: 0 }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  # ───────────────────────── Salud ─────────────────────────
  /health:
    get:
      tags: [Salud]
      summary: Estado del servicio
      description: Disponible en los cuatro puertos; sirve para los healthchecks de Docker.
      operationId: salud
      security: []
      responses:
        '200':
          description: El servicio responde
          content:
            application/json:
              schema:
                type: object
                required: [servicio, estado]
                properties:
                  servicio: { type: string, enum: [autenticacion, veterinaria, adopcion, dashboard] }
                  estado: { type: string, const: ok }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Token de `POST /auth/login`. Dura `SESION_HORAS` (8 h por defecto).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    Validacion:
      description: Datos inválidos (un detalle por campo)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: Datos inválidos.
            detalles:
              - { campo: nombre, mensaje: El nombre es obligatorio. }
              - { campo: fecha_ingreso, mensaje: La fecha de ingreso debe ser una fecha válida (AAAA-MM-DD). }
    NoAutenticado:
      description: Sin sesión, sesión cerrada o vencida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Debes iniciar sesión. }
    Prohibido:
      description: "El rol del usuario no tiene acceso (HU-07). Dashboard: administrador. Adopciones: administrador y responsable_adopciones. Registrar atención: administrador y veterinario."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: No tienes permiso para acceder a esta sección. }
    NoEncontrado:
      description: El recurso no existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: El perro no existe. }
    Conflicto:
      description: Regla de negocio (perro no disponible, transición no permitida, estado controlado por la adopción)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: No se puede pasar una adopción de "Aprobada" a "Aprobada". }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detalles:
          type: array
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo: { type: [string, 'null'] }
              mensaje: { type: string }

    Rol:
      type: string
      enum: [administrador, veterinario, responsable_adopciones]
    Sexo:
      type: string
      enum: [macho, hembra]
    EstadoPerro:
      type: string
      enum: [disponible, en_tratamiento, en_adopcion, adoptado]
    EstadoAdopcion:
      type: string
      enum: [en_proceso, aprobada, rechazada, finalizada]

    Usuario:
      type: object
      required: [id, nombre_completo, correo, rol]
      properties:
        id: { type: integer, example: 4 }
        nombre_completo: { type: string, example: María Alvarado }
        correo: { type: string, format: email, example: maria.alvarado@peluchin.test }
        rol: { $ref: '#/components/schemas/Rol' }

    RespuestaLogin:
      type: object
      required: [token, expira, usuario]
      properties:
        token: { type: string, example: KbvPH1aJscNdcfHln62juRg6x4zTQzy4NOyciTOVpS0 }
        expira: { type: string, format: date-time }
        usuario: { $ref: '#/components/schemas/Usuario' }

    Codigo:
      type: object
      required: [codigo, nombre]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }

    Catalogos:
      type: object
      required: [razas, tamanos, estados_perro, estados_solicitud]
      properties:
        razas:
          type: array
          items:
            type: object
            required: [id, nombre]
            properties:
              id: { type: integer, example: 1 }
              nombre: { type: string, example: Mestizo }
        tamanos:
          type: array
          items: { $ref: '#/components/schemas/Codigo' }
        estados_perro:
          type: array
          items: { $ref: '#/components/schemas/Codigo' }
        estados_solicitud:
          type: array
          items: { $ref: '#/components/schemas/Codigo' }

    DatosPerro:
      type: object
      required: [nombre, raza_id, sexo, tamano, fecha_ingreso]
      properties:
        nombre: { type: string, maxLength: 80 }
        raza_id: { type: integer }
        sexo: { $ref: '#/components/schemas/Sexo' }
        tamano: { type: string, description: 'Código del catálogo: pequeno, mediano o grande.' }
        fecha_ingreso: { type: string, format: date }
        fecha_nacimiento: { type: [string, 'null'], format: date }
        edad_aproximada:
          type: [object, 'null']
          description: Alternativa a `fecha_nacimiento`; se guarda como fecha estimada.
          properties:
            anios: { type: integer, minimum: 0, maximum: 30 }
            meses: { type: integer, minimum: 0, maximum: 11 }
        color: { type: [string, 'null'], maxLength: 50 }
        foto_url: { type: [string, 'null'], maxLength: 500, description: 'URL http:// o https://' }
        estado:
          type: string
          enum: [disponible, en_tratamiento]
          description: Por defecto `disponible` al registrar.

    Perro:
      type: object
      required: [id, nombre, sexo, raza_id, raza, tamano, fecha_ingreso, estado, estado_nombre]
      properties:
        id: { type: integer, example: 3 }
        nombre: { type: string, example: Bella }
        sexo: { $ref: '#/components/schemas/Sexo' }
        raza_id: { type: integer, example: 2 }
        raza: { type: string, example: Beagle }
        color: { type: [string, 'null'], example: Tricolor }
        tamano: { type: string, example: pequeno }
        tamano_nombre: { type: string, example: Pequeño }
        fecha_nacimiento: { type: [string, 'null'], format: date }
        fecha_nacimiento_estimada: { type: boolean }
        edad_meses: { type: [integer, 'null'], example: 57 }
        fecha_ingreso: { type: string, format: date }
        estado: { $ref: '#/components/schemas/EstadoPerro' }
        estado_nombre: { type: string, example: Disponible }
        foto_url: { type: [string, 'null'] }
        registrado_por: { type: [integer, 'null'] }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }

    PerroPublico:
      type: object
      description: Datos que el catálogo público puede mostrar (sin estado interno ni quién lo registró).
      required: [id, nombre, sexo, raza, tamano, tamano_nombre, edad_meses, fecha_nacimiento_estimada, fecha_ingreso]
      properties:
        id: { type: integer, example: 5 }
        nombre: { type: string, example: Coco }
        sexo: { $ref: '#/components/schemas/Sexo' }
        raza: { type: string, example: Chihuahua }
        tamano: { type: string, example: pequeno }
        tamano_nombre: { type: string, example: Pequeño }
        color: { type: [string, 'null'], example: Café claro }
        foto_url: { type: [string, 'null'] }
        edad_meses: { type: [integer, 'null'], example: 44 }
        fecha_nacimiento_estimada: { type: boolean }
        fecha_ingreso: { type: string, format: date }

    SolicitudPublica:
      type: object
      required: [id, perro_id, perro_nombre, nombre_completo, telefono, estado, creado_en]
      properties:
        id: { type: integer }
        perro_id: { type: integer }
        perro_nombre: { type: string, example: Coco }
        perro_foto_url: { type: [string, 'null'] }
        perro_estado: { $ref: '#/components/schemas/EstadoPerro' }
        nombre_completo: { type: string, example: Laura Quispe }
        telefono: { type: string, example: '70012345' }
        correo: { type: [string, 'null'] }
        mensaje: { type: [string, 'null'] }
        estado: { type: string, enum: [pendiente, convertida, descartada] }
        solicitud_id: { type: [integer, 'null'], description: Adopción creada a partir de esta solicitud. }
        revisado_por: { type: [integer, 'null'] }
        revisado_por_nombre: { type: [string, 'null'] }
        revisado_en: { type: [string, 'null'], format: date-time }
        creado_en: { type: string, format: date-time }

    PerroDetalle:
      allOf:
        - $ref: '#/components/schemas/Perro'
        - type: object
          required: [adopcion_vigente]
          properties:
            adopcion_vigente:
              description: "Adopción en proceso o aprobada; `null` si no tiene. HU-07: siempre `null` para el rol veterinario (trae datos del adoptante)."
              oneOf:
                - $ref: '#/components/schemas/Adopcion'
                - type: 'null'

    Adoptante:
      type: object
      required: [id, nombre_completo, telefono, direccion]
      properties:
        id: { type: integer }
        nombre_completo: { type: string, example: Carlos Mendoza Vargas }
        documento_identidad: { type: [string, 'null'], example: '4875123' }
        telefono: { type: string, example: '71234567' }
        direccion: { type: string, example: 'Av. 6 de Agosto #2170, Sopocachi, La Paz' }

    Adopcion:
      type: object
      required: [id, estado, estado_nombre, fecha_solicitud, perro, adoptante]
      properties:
        id: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoAdopcion' }
        estado_nombre: { type: string, example: En proceso }
        fecha_solicitud: { type: string, format: date }
        fecha_aprobacion: { type: [string, 'null'], format: date }
        fecha_rechazo: { type: [string, 'null'], format: date }
        fecha_adopcion: { type: [string, 'null'], format: date }
        observaciones: { type: [string, 'null'] }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }
        perro:
          type: object
          required: [id, nombre, estado]
          properties:
            id: { type: integer }
            nombre: { type: string }
            raza: { type: string }
            sexo: { $ref: '#/components/schemas/Sexo' }
            tamano: { type: string }
            tamano_nombre: { type: string }
            edad_meses: { type: [integer, 'null'] }
            fecha_nacimiento_estimada: { type: boolean }
            estado: { $ref: '#/components/schemas/EstadoPerro' }
            estado_nombre: { type: string }
            foto_url: { type: [string, 'null'] }
        adoptante: { $ref: '#/components/schemas/Adoptante' }

    AdopcionDetalle:
      allOf:
        - $ref: '#/components/schemas/Adopcion'
        - type: object
          required: [transiciones_permitidas]
          properties:
            transiciones_permitidas:
              type: array
              items: { $ref: '#/components/schemas/EstadoAdopcion' }
              example: [aprobada, rechazada]

    Consulta:
      type: object
      required: [id, perro_id, fecha, motivo, diagnostico, tratamiento, veterinario_id, veterinario_nombre]
      properties:
        id: { type: integer }
        perro_id: { type: integer }
        fecha: { type: string, format: date }
        motivo: { type: string, example: Seguimiento de tratamiento }
        diagnostico: { type: string }
        tratamiento: { type: string }
        observaciones: { type: [string, 'null'] }
        veterinario_id: { type: integer }
        veterinario_nombre: { type: string, example: Andrés Ramírez }
        creado_en: { type: string, format: date-time }

    Vacuna:
      type: object
      required: [id, perro_id, nombre, fecha_aplicacion, fecha_proxima_dosis, veterinario_id, veterinario_nombre]
      properties:
        id: { type: integer }
        perro_id: { type: integer }
        nombre: { type: string, example: Antirrábica }
        fecha_aplicacion: { type: string, format: date }
        fecha_proxima_dosis: { type: [string, 'null'], format: date }
        observaciones: { type: [string, 'null'] }
        veterinario_id: { type: integer }
        veterinario_nombre: { type: string, example: Andrés Ramírez }
        creado_en: { type: string, format: date-time }

    Desparasitacion:
      type: object
      required: [id, perro_id, tipo, producto, fecha_aplicacion, fecha_proxima, veterinario_id, veterinario_nombre]
      properties:
        id: { type: integer }
        perro_id: { type: integer }
        tipo: { type: string, enum: [interna, externa] }
        producto: { type: string, example: Fipronil (pipeta) }
        fecha_aplicacion: { type: string, format: date }
        fecha_proxima: { type: [string, 'null'], format: date }
        observaciones: { type: [string, 'null'] }
        veterinario_id: { type: integer }
        veterinario_nombre: { type: string, example: Lucía Torres }
        creado_en: { type: string, format: date-time }

    ControlPendiente:
      type: object
      required: [tipo, control_id, perro_id, perro_nombre, detalle, ultima_aplicacion, fecha_programada, dias_restantes, vencido]
      properties:
        tipo: { type: string, enum: [vacuna, desparasitacion] }
        control_id: { type: integer, description: id de la vacuna o desparasitación que programó el control. }
        perro_id: { type: integer }
        perro_nombre: { type: string, example: Toby }
        perro_foto_url: { type: [string, 'null'] }
        perro_estado: { $ref: '#/components/schemas/EstadoPerro' }
        detalle: { type: string, example: Antirrábica, description: 'Nombre de la vacuna o "Desparasitación interna/externa".' }
        ultima_aplicacion: { type: string, format: date }
        fecha_programada: { type: string, format: date }
        dias_restantes: { type: integer, example: -10, description: Negativo si ya venció. }
        vencido: { type: boolean }

    Resumen:
      type: object
      required: [total, por_estado, indicadores]
      properties:
        total: { type: integer, example: 8 }
        por_estado:
          type: array
          items:
            type: object
            required: [codigo, nombre, cantidad]
            properties:
              codigo: { $ref: '#/components/schemas/EstadoPerro' }
              nombre: { type: string }
              cantidad: { type: integer }
        indicadores:
          type: object
          required: [en_albergue, disponibles, en_tratamiento, adopciones_mes, solicitudes_pendientes]
          properties:
            en_albergue: { type: integer, description: Todos menos los adoptados. }
            disponibles: { type: integer }
            en_tratamiento: { type: integer }
            adopciones_mes: { type: integer, description: Adopciones finalizadas en el mes actual. }
            solicitudes_pendientes: { type: integer, description: Solicitudes en proceso o aprobadas. }
